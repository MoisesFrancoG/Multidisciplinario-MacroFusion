<div class="p-6 bg-white shadow-md flex justify-between items-center">
  <div class="flex items-center space-x-4">
    <img routerLink="/" src="/assets/logoMF.jpg" alt="MacroFusion Logo" class="w-20 cursor-pointer">
    <span class="font-bold text-6xl pl-6">MacroFusion</span>
  </div>

  <div class="relative">
    <img src="/assets/perfil.png" alt="Perfil" class="h-14 w-14 rounded-full cursor-pointer transition-transform duration-200 ease-in-out transform hover:scale-105" (click)="toggleDropdown()">

    <div *ngIf="showDropdown" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg z-50">
      <a class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" routerLink="/personal-info">Perfil</a>
      <a class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" (click)="logout()">Cerrar Sesión</a>
    </div>
  </div>
</div>

<!-- Pantalla de carga -->
<div *ngIf="isLoading" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="text-center">
    <img src="/assets/logoMF.jpg" alt="Nutriologo" class="w-32 h-32 rounded-full mb-4 animate-ping">
    <!-- <p class="text-white text-xl font-bold  animate-ping ">Cargando...</p> -->
  </div>
</div>

<div *ngIf="!isLoading" class="pb-20 pt-20 ">
  <div class="grid grid-cols-3 gap-4 p-6 ">

    <div class="flex flex-col justify-between text-center shadow rounded cursor-pointer border transition-transform duration-500 ease-in-out transform hover:scale-105" (click)="navigateWithLoader('/canasta')">
      <div class=" bg-cover h-3/4 bg-center" style="background-image: url('/assets/canasta.jpg'); " >
      </div>
      <div class="bg-cover h-1/4 " style="background-color: rgb(212, 212, 212);">
        <strong> <p class="text-3xl pt-6">Canasta de alimentos</p> </strong>
      </div>
      <!-- <img src="/assets/canasta.jpg" alt="Canasta de alimentos" class=" h-3/4 rounded"> -->
    </div>

    <div class="flex flex-col justify-between text-center shadow rounded cursor-pointer border transition-transform duration-500 ease-in-out transform hover:scale-105" (click)="navigateWithLoader('/comidas')">
      <!-- <img src="/assets/comida.jpg" alt="Comidas" class="h-3/4 rounded"> -->
      <div class=" bg-cover h-3/4 bg-center" style="background-image: url('/assets/comida.jpg'); " ></div>
      <div class="bg-cover h-1/4 " style="background-color: rgb(212, 212, 212);">
        <strong> <p class="text-3xl pt-6">Comidas</p> </strong>
      </div>
    </div>

    <div class="flex flex-col justify-between text-center shadow rounded cursor-pointer border transition-transform duration-500 ease-in-out transform hover:scale-105" (click)="navigateWithLoader('/ejercicios')">
      <!-- <div class=" bg-cover h-3/4 bg-center" style="background-image: url('/assets/ejercicios.jpg'); "> -->
              <img src="/assets/ejercicios.jpg" alt="Comidas" class="h-3/4 rounded">
      <!-- </div> -->
      <div class="bg-cover h-1/4 " style="background-color: rgb(212, 212, 212);">
        <strong> <p class="text-3xl pt-6">Ejercicios</p> </strong>
      </div>
    </div>
  </div>
</div>
