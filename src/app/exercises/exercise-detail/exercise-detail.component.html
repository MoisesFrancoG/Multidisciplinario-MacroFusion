<div class="container mx-auto p-4">
  <h2 class="text-center text-lime-600 text-2xl font-bold mb-4">{{ zone }}</h2>

  <div class="flex mb-4">
    <label for="zoneSelect" class="block text-lg font-medium text-gray-700">Nivel:</label>
    <select
      id="zoneSelect"
      class="mt-1 block w-full pl-3 pr-10 text-base border-gray-800 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md"
      (change)="onLevelChange($event)"
    >
      <option *ngFor="let nivel of niveles" [value]="nivel">{{ nivel }}</option>
    </select>
  </div>

  <div *ngIf="ejercicios.length > 0; else noData" class="grid grid-cols-1 gap-4">
    <app-ejercicio-card *ngFor="let ejercicio of ejercicios" [ejercicio]="ejercicio"></app-ejercicio-card>
  </div>

  <ng-template #noData>
    <p class="text-center text-gray-500">No hay ejercicios disponibles para esta selección.</p>
  </ng-template>
</div>
