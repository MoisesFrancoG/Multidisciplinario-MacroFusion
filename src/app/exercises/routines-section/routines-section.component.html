<div class="p-6 bg-white shadow-md flex justify-between items-center">
  <div class="flex items-center space-x-4">
    <img routerLink="/ejercicios" src="/assets/logoMF.jpg" alt="MacroFusion Logo" class="w-20 cursor-pointer">
    <span class="font-bold text-6xl pl-6">MacroFusion</span>
  </div>

  <div class="relative">
    <img src="/assets/perfil.png" alt="Perfil" class="h-14 w-14 rounded-full cursor-pointer transition-transform duration-200 ease-in-out transform hover:scale-105" (click)="toggleDropdown()">

    <div *ngIf="showDropdown" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg z-50">
      <a class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" routerLink="/personal-info">Perfil</a>
      <a class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" (click)="logout()">Cerrar Sesión</a>
    </div>
  </div>
</div>


<!-- Pantalla de carga -->
<div *ngIf="isLoading" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="text-center">
    <img src="/assets/logoMF.jpg" alt="Nutriologo" class="w-32 h-32 rounded-full mb-4 animate-ping">
    <!-- <p class="text-white text-xl font-bold  animate-ping ">Cargando...</p> -->
  </div>
</div>


<div class=" pt-10">
  <h1 class="text-center text-6xl " style="letter-spacing: 0.1em;">RUTINAS</h1>
  <div class="grid grid-cols-2 gap-4 p-6 ">


    <div class="flex flex-col justify-between text-center shadow rounded cursor-pointer hover:scale-105 hover:shadow-lg transition transform duration-300" (click)="navigateToRoutineWithLoader(2)" style="border: 4px solid #ccc;">
      <img src="/assets/calistenia.jpg" alt="Brazo" class="w-full h-56 object-cover">
      <div style="background-color: rgb(212, 212, 212);">
        <p class="text-3xl py-6">CALISTENIA</p>
      </div>
    </div>

    <div class="flex flex-col justify-between text-center shadow rounded cursor-pointer hover:scale-105 hover:shadow-lg transition transform duration-300" (click)="navigateToRoutineWithLoader(3)" style="border: 4px solid #ccc;">
      <img src="/assets/gym.jpg" alt="Abdomen" class="w-full h-56 object-cover">
      <div style="background-color: rgb(212, 212, 212);">
        <p class="text-3xl py-6">GYM</p>
      </div>
    </div>

    <div class="flex flex-col justify-between text-center shadow rounded cursor-pointer hover:scale-105 hover:shadow-lg transition transform duration-300" (click)="navigateToRoutineWithLoader(1)" style="border: 4px solid #ccc;">
      <img src="/assets/exerciseHome.jpg" alt="Pecho y Espalda" class="w-full h-56 object-cover">
      <div style="background-color: rgb(212, 212, 212);">
        <p class="text-3xl py-6">EJERCICIO EN CASA</p>
      </div>
    </div>

    <div class="flex flex-col justify-between text-center shadow rounded cursor-pointer hover:scale-105 hover:shadow-lg transition transform duration-300" (click)="navigateToRoutineWithLoader(4)" style="border: 4px solid #ccc;">
      <img src="/assets/fuerza.jpg" alt="Pierna" class="w-full h-56 object-cover">
      <div style="background-color: rgb(212, 212, 212);">
        <p class="text-3xl py-6">FUERZA</p>
      </div>
    </div>

  </div>

</div>
