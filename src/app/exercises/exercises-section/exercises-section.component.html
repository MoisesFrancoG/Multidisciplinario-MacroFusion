<!-- EXERCISES DASHBOARD -->
<div class="p-6 bg-white shadow-md flex justify-between items-center">
  <div class="flex items-center space-x-4">
    <img routerLink="/dashboard" src="/assets/logoMF.jpg" alt="MacroFusion Logo" class="w-20 cursor-pointer">
    <span class="font-bold text-6xl pl-6">MacroFusion</span>
  </div>

  <div class="relative">
    <img src="/assets/perfil.png" alt="Perfil" class="h-14 w-14 rounded-full cursor-pointer transition-transform duration-200 ease-in-out transform hover:scale-105" (click)="toggleDropdown()">

    <div *ngIf="showDropdown" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg z-50">
      <a class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" routerLink="/personal-info">Perfil</a>
      <a class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" (click)="logout()">Cerrar Sesión</a>
    </div>
  </div>
</div>

<div class=" pt-10">
  <h1 class="text-center text-6xl ">GRUPOS MUSCULARES</h1>
  <div class="grid grid-cols-4 gap-4 p-6 ">


    <div class="flex flex-col justify-between text-center shadow rounded cursor-pointer hover:scale-105 hover:shadow-lg transition transform duration-300" (click)="navigateToDetail('BRAZO')" style="border: 4px solid #ccc;">
      <img src="/assets/brazo.jpg" alt="Brazo" class="w-full h-48 object-cover">
      <div style="background-color: rgb(212, 212, 212);">
        <p class="text-3xl py-6">BRAZO</p>
      </div>
    </div>

    <div class="flex flex-col justify-between text-center shadow rounded cursor-pointer hover:scale-105 hover:shadow-lg transition transform duration-300" (click)="navigateToDetail('ABDOMEN')" style="border: 4px solid #ccc;">
      <img src="/assets/ABS.jpg" alt="Abdomen" class="w-full h-48 object-cover">
      <div style="background-color: rgb(212, 212, 212);">
        <p class="text-3xl py-6">ABDOMEN</p>
      </div>
    </div>

    <div class="flex flex-col justify-between text-center shadow rounded cursor-pointer hover:scale-105 hover:shadow-lg transition transform duration-300" (click)="navigateToDetail('PECHO Y ESPALDA')" style="border: 4px solid #ccc;">
      <img src="/assets/ChestAndBack.jpg" alt="Pecho y Espalda" class="w-full h-48 object-cover">
      <div style="background-color: rgb(212, 212, 212);">
        <p class="text-3xl py-6">PECHO Y ESPALDA</p>
      </div>
    </div>

    <div class="flex flex-col justify-between text-center shadow rounded cursor-pointer hover:scale-105 hover:shadow-lg transition transform duration-300" (click)="navigateToDetail('PIERNA')" style="border: 4px solid #ccc;">
      <img src="/assets/leg.jpg" alt="Pierna" class="w-full h-48 object-cover">
      <div style="background-color: rgb(212, 212, 212);">
        <p class="text-3xl py-6">PIERNA</p>
      </div>
    </div>

    <div class="col-span-4 flex flex-col justify-between text-center shadow rounded cursor-pointer hover:scale-105 hover:shadow-lg transition transform duration-300" (click)="navigateToRoutines()" style="border: 4px solid #ccc;">
        <!-- <h1 class="text-center"> RUTINAS </h1> -->
        <img src="/assets/rutina1.jpg" alt="Rutinas" class="w-full h-56 object-cover">
        <div style="background-color: rgb(212, 212, 212);">
          <p class="text-3xl py-6 " style="letter-spacing: 0.3em;">RUTINAS</p>
        </div>
  </div>
  </div>

</div>
