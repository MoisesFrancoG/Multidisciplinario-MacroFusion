<div class="fixed inset-0 bg-gray-800 bg-opacity-50 flex justify-center items-center z-50">
  <div class="bg-white rounded-lg shadow-lg w-1/3 p-6">
    <h2 class="text-2xl font-bold mb-4">{{ isEditMode ? 'Editar Alimento' : 'Detalle Alimento' }}</h2>
    <div>
      <p><strong>Nombre:</strong> {{ food.nombre }}</p>
      <p><strong>Aporte:</strong> {{ food.calorias }} Kcal x {{ food.porcion }} {{ food.tipomedida }}</p>
    </div>
    <div class="mt-4">
      <label for="portion" class="block font-semibold mb-2">Porción:</label>
      <input
        type="number"
        id="portion"
        [(ngModel)]="portion"
        class="w-full px-3 py-2 border rounded"
        placeholder="Especifica la porción"
      />
    </div>
    <div class="mt-4">
      <label for="category" class="block font-semibold mb-2">Categoría:</label>
      <select id="category" [(ngModel)]="category" class="w-full px-3 py-2 border rounded">
        <option value="Desayuno">Desayuno</option>
        <option value="Comida">Comida</option>
        <option value="Cena">Cena</option>
        <option value="Colacion">Colación</option>
      </select>
    </div>
    <div class="flex justify-center mt-6 ">
      <button
        (click)="addFood()"
        class="bg-green-500 hover:bg-green-700 text-black hover:text-white font-bold py-2 px-4 rounded mr-2"
      >
        {{ isEditMode ? 'Guardar' : 'Agregar' }}
      </button>
      <button
        (click)="closeModal()"
        class="bg-green-500 hover:bg-green-700 text-black hover:text-white font-bold py-2 px-4 rounded"
      >
        Cancelar
      </button>
    </div>
  </div>
</div>
